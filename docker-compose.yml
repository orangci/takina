services:
  db:
    image: postgres:16
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - database:/data/db
    environment:
      - POSTGRES_USER=bot
      - POSTGRES_DB=takina
      - POSTGRES_PASSWORD=password
  takina:
    image: ghcr.io/orangci/takina:latest
    restart: always
    env_file: ".env"

volumes:
  database:
