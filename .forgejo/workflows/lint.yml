name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up uv
        uses: https://github.com/astral-sh/setup-uv@v10.3.2
        with:
          # the floor in requires-python and what the docker image runs; uv would
          # otherwise take the newest python, which not every wheel supports yet
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --locked
      - name: Ruff format
        run: uv run ruff format --check
      - name: Ruff check
        # the config fixes by default, which would hide problems here
        run: uv run ruff check --no-fix
      - name: Ty check
        run: uv run ty check
      - name: Import order
        run: uv run python scripts/check_imports.py
      - name: Smoke test
        run: uv run python -m pytest -q
