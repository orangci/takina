<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery | Takina</title>
    <meta name="description" content="Screenshots of Takina, the cutest open-source multipurpose Discord bot, in action." />
    <meta property="og:title" content="Takina | Gallery" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://takina.is-a.bot/gallery" />
    <meta property="og:description" content="Screenshots of Takina in action." />
    <meta name="theme-color" content="#ffb48a" />
    <link rel="shortcut icon" href="takina.ico" type="image/x-icon" />
    <link rel="stylesheet" href="styles/site.css" />
</head>

<body>
    <header class="site-header">
        <div class="wrap">
            <a href="./" class="brand">
                <img src="assets/takina.webp" alt="" width="32" height="32" />
                Takina
            </a>
            <nav class="site-nav" aria-label="Main">
                <a href="./#commands">Commands</a>
                <a href="gallery.html" aria-current="page">Gallery</a>
                <a href="./#selfhost">Self-host</a>
                <a href="https://discord.com/oauth2/authorize?client_id=1287074090783604797" class="btn btn-primary">Invite</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="wrap">
            <div class="section-head" style="padding-top: clamp(2.5rem, 6vw, 4rem)">
                <h1 style="font-size: clamp(2rem, 5vw, 2.75rem); font-weight: 600">Gallery</h1>
                <p>A preview of what Takina can do. Some shots predate 2.0 and may look slightly different today. Click one to zoom.</p>
            </div>
            <div id="gallery" class="gallery"></div>
            <noscript><p class="empty">The gallery needs JavaScript, I'm afraid.</p></noscript>
        </div>
    </main>

    <dialog id="lightbox" class="lightbox" aria-label="Screenshot viewer">
        <img id="lightbox-img" src="" alt="" />
        <div class="lightbox-bar">
            <button id="prev" class="btn" type="button" aria-label="Previous">&larr;</button>
            <span id="lightbox-caption"></span>
            <span>
                <button id="next" class="btn" type="button" aria-label="Next">&rarr;</button>
                <button id="close" class="btn" type="button">Close</button>
            </span>
        </div>
    </dialog>

    <footer class="site-footer">
        <div class="wrap">
            <nav aria-label="Footer">
                <a href="privacy.html">Privacy</a>
                <a href="tos.html">Terms</a>
                <a href="https://www.gnu.org/licenses/agpl-3.0.html">License</a>
                <a href="https://git.orangc.net/c/takina">Source</a>
            </nav>
            <span>&copy; 2024&ndash;present <a href="https://orangc.net">orangc</a></span>
        </div>
    </footer>

    <script src="scripts/gallery.js"></script>
    <script src="scripts/oneko.js"></script>
</body>

</html>
