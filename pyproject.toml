[project]
name = "takina"
version = "2.0.0"
description = "The cutest multipurpose Discord bot."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiodns>=4.0.4",
    "aiohttp>=3.14.3",
    "alembic>=1.20.1",
    "asyncpg>=0.31.0",
    "audioop-lts>=0.2.2",
    "brotli>=1.2.0",
    "discord-py>=2.7.1",
    "dnspython>=2.8.0",
    "geopy>=2.5.0",
    "greenlet>=3.5.4",
    "hypixel.py>=0.4.2",
    "open-meteo>=0.4.0",
    "ping3>=5.1.6",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.0.51",
    "sqlmodel>=0.0.39",
    "tzdata>=2026.3",
    "tzfpy>=2.1.0",
    "whodap>=0.2.1",
    "wikipedia-api>=0.16.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
    "ty>=0.0.84",
]

[tool.ruff]
line-length = 100
fix = true
show-fixes = true
target-version = "py313"
indent-width = 4

[tool.ruff.format]
docstring-code-format = true
# docstring-code-line-length = 79
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = true

[tool.ruff.lint]
# import order is longest first by convention, which isort cannot express
ignore = ["I001"]

[tool.ruff.lint.per-file-ignores]
# generated revisions import sa and sqlmodel whether or not they use them
"takina/migrations/versions/*" = ["F401"]

[tool.ruff.analyze]
detect-string-imports = true
