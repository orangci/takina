[project]
name = "takina"
version = "2.0.0"
description = "The cutest multipurpose Discord bot."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiodns==4.0.4",
    "aiohttp==3.14.3",
    "audioop-lts==0.2.2",
    "brotli==1.2.0",
    "distlib==0.4.3",
    "emoji==2.15.0",
    "filelock==3.32.5",
    "geopy==2.5.0",
    "motor>=3.7.1",
    "open-meteo==0.4.0",
    "orjson==3.12.0",
    "ping3==5.1.5",
    "platformdirs==4.11.7",
    "pygithub==2.10.0",
    "python-dotenv==1.2.3",
    "pytz==2026.3.post1",
    "setuptools==84.0.0",
    "tzfpy==1.3.3",
    "virtualenv==21.7.8",
    "whodap==0.1.16",
    "wikipedia-api==0.16.0",
    "nltk==3.10.3",
    "hypixel.py==0.4.2",
    "psycopg[binary]>=3.3.4",
    "discord-py>=2.7.1",
    "psycopg-pool>=3.3.1",
    "sqlmodel>=0.0.39",
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.31.0",
    "psycopg2-binary>=2.9.12",
    "greenlet>=3.5.4",
]

[tool.setuptools]
packages = ["takina"]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "ty>=0.0.63",
]

[tool.ruff]
line-length = 100
fix = true
show-fixes = true
target-version = "py313"
indent-width = 4

[tool.ruff.format]
docstring-code-format = true
# docstring-code-line-length = 79
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = true

[tool.ruff.analyze]
detect-string-imports = true
