repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        pass_filenames: false

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        pass_filenames: false

      - id: ty-check
        name: ty check
        entry: uv run ty check
        language: system
        pass_filenames: false

      # longest line first, which ruff's isort cannot express
      - id: import-order
        name: import order
        entry: python3 scripts/check_imports.py
        language: system
        types: [python]
        exclude: ^takina/migrations/

      - id: uv-lock
        name: uv lock
        entry: uv lock
        language: system
        pass_filenames: false

      # nix stuff
      - id: nixfmt
        name: nixfmt
        entry: sh -c 'if command -v nixfmt >/dev/null 2>&1; then find . -name "*.nix" -exec nixfmt {} +; elif command -v nix >/dev/null 2>&1; then find . -name "*.nix" -exec nix run nixpkgs#nixfmt -- {} +; else echo "Skipping nixfmt"; fi'
        language: system
        pass_filenames: false

      - id: statix-fix
        name: statix fix
        entry: sh -c 'if command -v statix >/dev/null 2>&1; then statix fix; elif command -v nix >/dev/null 2>&1; then nix run nixpkgs#statix -- fix; else echo "Skipping statix"; fi'
        language: system
        pass_filenames: false

      - id: deadnix
        name: deadnix
        entry: sh -c 'if command -v deadnix >/dev/null 2>&1; then deadnix -eq .; elif command -v nix >/dev/null 2>&1; then nix run nixpkgs#deadnix -- -eq .; else echo "Skipping deadnix"; fi'
        language: system
        pass_filenames: false
