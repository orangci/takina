repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        pass_filenames: false

      - id: ruff-check
        name: ruff check
        entry: ruff check
        language: system
        pass_filenames: false

      - id: uv-lock
        name: uv lock
        entry: uv lock
        language: system
        pass_filenames: false
